name: Build & Upload InsDrama APK to CDN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.8'

    - name: Build Release APK
      working-directory: ./insdrama-android
      run: |
        echo "Building RELEASE APK with Gradle 8.8..."
        ./gradlew assembleRelease --no-daemon --stacktrace
        echo "Build complete! Checking output..."
        ls -la app/build/outputs/apk/release/ || echo "APK not found!"

    - name: Rename APK
      run: |
        if [ -f insdrama-android/app/build/outputs/apk/release/app-release.apk ]; then
          cp insdrama-android/app/build/outputs/apk/release/app-release.apk INS.apk
          echo "✅ APK renamed successfully"
        else
          echo "❌ Release APK not found, trying debug..."
          if [ -f insdrama-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp insdrama-android/app/build/outputs/apk/debug/app-debug.apk INS.apk
            echo "✅ Debug APK used instead"
          else
            echo "❌ No APK found!"
            exit 1
          fi
        fi

    - name: Verify APK Signature
      run: |
        echo "🔍 Verifying APK signature..."
        unzip -p INS.apk META-INF/MANIFEST.MF 2>/dev/null && echo "✅ V1 Signature found" || echo "⚠️ No V1 signature"
        unzip -p INS.apk META-INF/*.SF 2>/dev/null && echo "✅ V2/V3 Signature found" || echo "⚠️ No V2/V3 signature"

    - name: Upload APK to CDN (InsJay)
      run: |
        echo "🚀 Uploading APK to CDN..."
        FILENAME="INS_$(date +%Y%m%d_%H%M%S).apk"
        curl -X POST \
          -H "accept: application/json, text/plain, */*" \
          -H "origin: https://cloudins-cdn.insjay.biz.id/" \
          -H "referer: https://cloudins-cdn.insjay.biz.id/" \
          -H "user-agent: Mozilla/5.0" \
          -F "file=@INS.apk;filename=$FILENAME" \
          https://cloudins-cdn.insjay.biz.id/files/ > upload_result.json || true
        echo "✅ Upload result:"
        cat upload_result.json || echo "No response"
        # Extract and display the CDN URL
        CDN_URL=$(cat upload_result.json | grep -o '"fileUrl":"[^"]*"' | cut -d'"' -f4)
        if [ -n "$CDN_URL" ]; then
          echo ""
          echo "=========================================="
          echo "🎉 APK UPLOADED SUCCESSFULLY!"
          echo "📱 Download URL: $CDN_URL"
          echo "=========================================="
        fi

    - name: Upload CDN Result as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CDN-Upload-Result
        path: upload_result.json
        retention-days: 7

    - name: Upload APK as Artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: INS-Drama-Release
        path: INS.apk
        retention-days: 30
